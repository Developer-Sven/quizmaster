packages:
  - "apps/*"
  - "packages/*"
  - "scripts"
  - "e2e"

# Supply-Chain-Schutz (docs/03, docs/06)
minimumReleaseAge: 1440 # Minuten: Pakete erst 24 h nach Veröffentlichung
blockExoticSubdeps: true
trustPolicy: no-downgrade
# Parallele Prozesse dürfen nie selbst installieren – fehlende Pakete brechen ab.
verifyDepsBeforeRun: error
allowBuilds:
  esbuild: true

# Pin security fixes for transitive tooling dependencies.
overrides:
  semver@6: 7.8.5
  follow-redirects: 1.16.2
  fast-uri@3: 3.1.9
  fast-uri@4: 4.2.3
  # Lighthouse uses CDP only. Remove the unused BiDi mapper, including its bundled
  # vulnerable Zod 3 (GHSA-mrhx-c7xc-m3w5); an external Zod override cannot fix it.
  # Version-scoped deliberately: recheck the CDP path when upgrading Puppeteer.
  "puppeteer-core@25.12.0>chromium-bidi": "-"
