# CI für quizmaster (docs/11 §CI, Schritte 1–7). Prüft und baut nur – deployt wird ausschließlich auf dem
# Server mit `pnpm deploy:prod` (ADR-025: kein Server-Schlüssel in GitHub). Keine echten Secrets: Tests laufen
# gegen MongoMemoryReplSet 8.0.32 mit Dummy-Secrets, E2E über das Stack-Skript ebenso.
#
# Sicherheit: nur `contents: read`, Actions per Commit-SHA gepinnt (Dependabot aktualisiert sie mit
# Wartezeit), `persist-credentials: false`, keine `pull_request_target`-Trigger, keine Ausdrücke aus
# Ereignisdaten in `run:`-Blöcken.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MONGOMS_VERSION: "8.0.32"
  MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  # docs/11 Schritte 1–3: Checkout, pnpm + Node 24, Install, Biome, Typecheck, Tests, Content
  check:
    name: Lint · Typecheck · Tests · Content
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: MongoDB-Binary für MongoMemoryReplSet cachen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-binaries-${{ runner.os }}-${{ env.MONGOMS_VERSION }}

      - name: Lint (Biome)
        run: pnpm lint

      - name: Shell-Skripte (shellcheck)
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --version | head -n 2
          # SC1111: deutsche Anführungszeichen „…“ in Meldungstexten sind Absicht.
          shellcheck -x -P SCRIPTDIR --severity=warning --exclude=SC1111 infra/ops/*.sh infra/caddy/*.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (Unit, Property, Integration mit MongoMemoryReplSet)
        run: pnpm test

      - name: Content-Validierung (Fixtures – der Katalog liegt nicht im Repo, ADR-021)
        run: pnpm content:validate

  # docs/11 Schritt 4: Produktions-Build (Next standalone inkl. Service Worker, Realtime-Bundle)
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build (web + realtime)
        run: pnpm build

      - name: Build-Ausgabe wie vom Deploy erwartet
        run: |
          test -f apps/web/.next/standalone/apps/web/server.js
          test -d apps/web/.next/static
          test -f apps/realtime/dist/index.mjs

      # Initiales JS (gzip) je Route aus der Build-Ausgabe (Framework + Layout + Fehlergrenze + Seite); Abbruch bei
      # Überschreitung: „/“ ≤ 165 KB (ADR-037), /lobby/[code] ≤ 180 KB (docs/07) – Werte in scripts/perf/lib/bundle.ts.
      - name: Bundle-Budgets (docs/07, ADR-037)
        run: node scripts/perf/bundle-budget.ts --dist apps/web/.next

  # docs/11 Schritt 7: Lighthouse mobil (Performance ≥ 90, A11y ≥ 95, Best Practices ≥ 95; LCP/CLS/TBT, ADR-027) für
  # Start- und Lobby-Seite auf einem eigenen Prod-Build mit Test-Stack (MongoMemoryReplSet, Fixtures). Zunächst nur
  # Warnungen (--warn-only, GitHub-Annotationen): Lighthouse auf geteilten Runnern schwankt – Abbruch erst mit
  # stabilem Schwellwert. Berichte als Artefakt.
  lighthouse:
    name: Lighthouse (mobil)
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: MongoDB-Binary für MongoMemoryReplSet cachen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-binaries-${{ runner.os }}-${{ env.MONGOMS_VERSION }}

      - name: Playwright-Version bestimmen
        id: playwright
        working-directory: e2e
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Playwright-Browser cachen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Chromium + Systemabhängigkeiten
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (web + realtime)
        run: pnpm build

      - name: Lighthouse (Start + Lobby, Median aus 3 Läufen)
        run: node scripts/perf/lighthouse.ts --runs 3 --warn-only

      - name: Lighthouse-Berichte hochladen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/lighthouse/
          retention-days: 7
          if-no-files-found: ignore

  # docs/11 Schritt 5: E2E mit Playwright (Stack-Skript nutzt in CI automatisch MongoMemoryReplSet)
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: MongoDB-Binary für MongoMemoryReplSet cachen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-binaries-${{ runner.os }}-${{ env.MONGOMS_VERSION }}

      - name: Playwright-Version bestimmen
        id: playwright
        working-directory: e2e
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Playwright-Browser cachen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Playwright-Browser + Systemabhängigkeiten
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E-Tests
        run: pnpm test:e2e

      - name: Berichte und Traces bei Fehlern hochladen
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # docs/11 Schritt 6: hohe/kritische Befunde in Produktionsabhängigkeiten brechen ab (docs/06)
  audit:
    name: Audit (pnpm audit --prod)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: pnpm audit --prod --audit-level high
        run: pnpm audit --prod --audit-level high

  # Dateisystem-Scan (Lockfile-Abhängigkeiten + Secrets) – ersetzt den Image-Scan aus docs/12 (ADR-024/025).
  # pnpm ≥ 11 schreibt pnpm-lock.yaml als Strom aus ZWEI YAML-Dokumenten: zuerst das Env-Lockfile des
  # Paketmanagers (nur pnpm/@pnpm/exe.*), danach das Projekt (Importer + Snapshots). Trivy (pnpm-Parser:
  # ein einziges yaml.Decode) liest nur das erste – ein Scan von `.` prüfte kein einziges Projektpaket.
  # Deshalb: Projekt-Dokument extrahieren und separat scannen; der Secret-Scan läuft getrennt über das Repo.
  trivy:
    name: Trivy (fs)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy Secrets (gesamtes Repo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          # Trivy-Cache (Schwachstellen-Datenbank) nie nach Secrets durchsuchen.
          skip-dirs: .cache
          exit-code: "1"
          format: table
          cache: "false"

      - name: Projekt-Lockfile für Trivy extrahieren (letztes YAML-Dokument)
        if: ${{ !cancelled() }}
        run: |
          out="$RUNNER_TEMP/trivy-lock"
          mkdir -p "$out"
          awk '/^---$/{n++; buf[n]=""; next} {buf[n]=buf[n] $0 ORS} END{printf "%s", buf[n]}' pnpm-lock.yaml \
            > "$out/pnpm-lock.yaml"
          grep -q '^  apps/web:$' "$out/pnpm-lock.yaml" \
            || { echo "::error::Projekt-Lockfile (Importer apps/web) nicht gefunden – Format von pnpm-lock.yaml prüfen"; exit 1; }
          echo "Projekt-Lockfile extrahiert ($(wc -l < "$out/pnpm-lock.yaml") Zeilen)"

      - name: Trivy Abhängigkeiten (HIGH/CRITICAL, nur behebbare)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/trivy-lock
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          # Trivy ist seit dem Secret-Scan installiert (setup-trivy setzt PATH für alle Folgeschritte).
          skip-setup-trivy: "true"
